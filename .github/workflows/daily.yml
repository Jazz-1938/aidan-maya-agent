name: daily-intelligence-digest

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run agent (daily)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --mode daily

      - name: Commit updated state
        run: |
          git config user.name "intelligence-agent"
          git config user.email "actions@github.com"
          touch seen.json trend_memory.json
          git add seen.json trend_memory.json
          if git diff --staged --quiet; then
            echo "No state change to commit."
          else
            git commit -m "Update state [skip ci]"
            git push
          fi
